[project]
name = "phoneme-speech-service"
version = "0.1.0"
description = "Free, self-hosted pronunciation scoring for Indian languages (Meta MMS + CTC forced alignment)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.20",
  "numpy>=1.26",
  "torch>=2.4",
  "transformers>=4.56",
  "safetensors>=0.4",
  "edge-tts>=7.0",
  "gTTS>=2.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
